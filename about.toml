# cargo-about configuration: generates THIRD-PARTY-LICENSES.html for releases.
#   cargo about generate --locked -o THIRD-PARTY-LICENSES.html about.hbs
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
