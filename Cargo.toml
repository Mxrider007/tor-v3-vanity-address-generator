[package]
name = "kore-vanity"
version = "0.1.0"
edition = "2021"
description = "Vanity onion address generator with GPU acceleration and CPU fallback"
license = "MIT"
repository = "https://github.com/Mxrider420z/kore-vanity"
readme = "README.md"
keywords = ["tor", "onion", "vanity", "gpu", "cuda"]

[workspace]
members = ["core", "gui"]

[lib]
name = "kore_vanity"
path = "src/lib.rs"

[[bin]]
name = "kore-vanity"
test = false
bench = false
path = "src/main.rs"

# By default the CLI/library build CPU-only plus the *external* CUDA backend
# (which just spawns the standalone `vanity_torv3_cuda` binary and needs no CUDA
# toolkit to compile). This links on any machine. Enable `--features cuda` for
# the built-in rustacuda GPU/hybrid backends, which require the CUDA toolkit and
# a working `libcuda` to link.
[features]
default = []
cuda = ["dep:rustacuda", "dep:kore-vanity-core"]
ptx-builder = ["dep:ptx-builder"]

[dependencies]
base32 = "0.5"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
curve25519-dalek = "4"
ed25519-dalek = { version = "2", features = ["rand_core", "hazmat"] }
num_cpus = "1.16"
rand = "0.8"
rayon = "1.10"
sha2 = "0.10"
sha3 = "0.10"
thiserror = "1.0"
ctrlc = "3.4"

rustacuda = { version = "0.1.2", optional = true }
kore-vanity-core = { version = "0.1.0", path = "./core", optional = true }

[build-dependencies]
ptx-builder = { version = "0.5", optional = true }

[profile.release]
lto = true
strip = true
opt-level = 3
