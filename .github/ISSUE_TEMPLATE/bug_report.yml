name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Never paste the contents of `hs_ed25519_secret_key` into an issue.** Security problems: see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "e.g. 1.0.0 (Help & source code link in the app, or `kore-vanity --version`)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware / GPU
      description: Output of `kore-vanity --list-gpus`, if relevant.
  - type: textarea
    id: output
    attributes:
      label: Messages or output
      render: text
