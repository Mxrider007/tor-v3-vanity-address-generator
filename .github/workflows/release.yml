name: Release

# Push a tag such as v1.0.0 to build all platforms and create a *draft*
# release with the archives, checksums and notes. Review it on GitHub and
# press "Publish release". The workflow can also be started by hand for an
# existing tag (Actions > Release > Run workflow).
#
# If a release for the tag already exists (for example one you created by
# hand), the workflow only adds archives that are not attached yet; it never
# replaces your files or your release notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: macos-universal
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "$RUNNER_OS" = macOS ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - name: Check the version matches the tag
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Cargo.toml version $version does not match tag $TAG"
            exit 1
          fi

      # Linux binaries are linked against glibc 2.28 (with Zig), so they run
      # on RHEL/Rocky 8+, Debian 10+, Ubuntu 18.10+ and similar.
      - name: Install Zig (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet ziglang==0.13.0
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-about@0.9.2,cargo-zigbuild@0.24.0

      - name: Build
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)
              cargo build --release --locked --workspace --target aarch64-apple-darwin
              cargo build --release --locked --workspace --target x86_64-apple-darwin
              ;;
            Linux)
              cargo zigbuild --release --locked --workspace --target x86_64-unknown-linux-gnu.2.28
              ;;
            *)
              cargo build --release --locked --workspace
              ;;
          esac

      - name: Smoke test
        if: runner.os != 'macOS'
        shell: bash
        run: |
          bin=target/release
          [ "$RUNNER_OS" = Linux ] && bin=target/x86_64-unknown-linux-gnu/release
          "$bin/torv3-vanity" --version
          "$bin/torv3-vanity" ab -o smoke-keys --gpu off
          "$bin/torv3-vanity" --verify smoke-keys/ab*
          rm -rf smoke-keys

      - name: Third-party licenses
        shell: bash
        run: cargo about generate --workspace --locked -o THIRD-PARTY-LICENSES.html about.hbs

      - name: Package
        shell: bash
        run: packaging/package.sh "${{ matrix.platform }}" "$TAG"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Lets anyone check that an archive was built here from this tag:
      #   gh attestation verify <archive> --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Release notes
        run: |
          packaging/release-notes.sh "$TAG" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create a draft release, or add missing files to an existing one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            existing=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            for file in dist/*; do
              if grep -qxF "$(basename "$file")" <<< "$existing"; then
                echo "::notice::$(basename "$file") is already attached; leaving it as it is"
              else
                gh release upload "$TAG" "$file"
              fi
            done
          else
            gh release create "$TAG" dist/* --draft --verify-tag \
              --title "Tor V3 Vanity Address Generator ${TAG#v}" --notes-file notes.md
          fi
