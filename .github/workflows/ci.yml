name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --features torv3-vanity/kernel-test -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      # kernel-test also runs the CUDA kernel, compiled for the CPU.
      - run: cargo test --workspace --locked --features torv3-vanity/kernel-test

  cuda:
    name: CUDA kernel
    # Pinned: the committed PTX is generated with this image's clang 18.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install clang 18
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-18
      - name: The committed PTX matches kernel.cu
        run: scripts/build-cuda-kernel.sh --check
      - name: NVIDIA's PTX assembler accepts it
        run: |
          python3 -m pip download --no-deps --only-binary :all: -d nvcc nvidia-cuda-nvcc-cu12==12.0.140
          echo "958d54df87d0c0b7207e7fed403d6eeda0890a01cc44cfeaccf87c7f90e9b165  nvcc/nvidia_cuda_nvcc_cu12-12.0.140-py3-none-manylinux1_x86_64.whl" | sha256sum -c
          python3 -m zipfile -e nvcc/*.whl nvcc
          ptxas=nvcc/nvidia/cuda_nvcc/bin/ptxas
          chmod +x "$ptxas"
          # GTX 900, GTX 10, RTX 20, RTX 30, RTX 40 and H100 series.
          for arch in sm_50 sm_61 sm_75 sm_86 sm_89 sm_90; do
            "$ptxas" -arch="$arch" -v src/search/gpu/cuda/kernel.ptx -o /dev/null
          done

  gpu:
    name: GPU kernel (software Vulkan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Install lavapipe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - name: Compare the GPU kernel with the CPU and search on the GPU
        run: cargo test -p torv3-vanity --lib --locked -- --ignored
        env:
          TORV3_VANITY_SOFTWARE_GPU: "1"

  tor:
    name: Keys work in Tor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tor
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tor
      - run: cargo build --release --locked -p torv3-vanity
      - run: scripts/tor-compat-test.sh target/release/torv3-vanity

  dependencies:
    name: Advisories and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit,cargo-about@0.9.2
      # Fails on known vulnerabilities (not on "unmaintained" notices).
      - run: cargo audit
      # Fails if a dependency's license is not accepted in about.toml, which
      # would otherwise only show up when building a release.
      - run: cargo about generate --workspace --locked -o THIRD-PARTY-LICENSES.html about.hbs

  msrv:
    name: Minimum Rust version (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup default 1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked
