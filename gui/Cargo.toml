[package]
name = "kore-vanity-gui"
version = "0.1.0"
edition = "2021"
description = "GUI for Kore vanity address generator"
license = "MIT"

[[bin]]
name = "kore-vanity-gui"
path = "src/main.rs"

[features]
default = []
cuda = ["kore-vanity/cuda"]

[dependencies]
eframe = "0.29"
egui = "0.29"

kore-vanity = { path = "..", default-features = false }

num_cpus = "1.16"
crossbeam-channel = "0.5"
chrono = "0.4"
directories = "5"
open = "5"
base32 = "0.5"

[target.'cfg(windows)'.dependencies]
rfd = "0.15"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
lto = true
strip = true
opt-level = 3
