[package]
name = "torv3-vanity-gui"
description = "Graphical interface for torv3-vanity, the Tor v3 .onion vanity address generator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "torv3-vanity-gui"
path = "src/main.rs"

[features]
default = ["gpu"]
gpu = ["torv3-vanity/gpu"]

[dependencies]
torv3-vanity = { path = "..", default-features = false }
eframe = { version = "0.36", features = ["persistence", "glow"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.17"
directories = "6"
open = { version = "5", features = ["shellexecute-on-windows"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
