[package]
name = "kore-vanity-gui"
description = "Graphical interface for kore-vanity, the Tor v3 .onion vanity address generator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "kore-vanity-gui"
path = "src/main.rs"

[features]
default = ["gpu"]
gpu = ["kore-vanity/gpu"]

[dependencies]
kore-vanity = { path = "..", default-features = false }
eframe = { version = "0.36", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.17"
directories = "6"
open = "5"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
